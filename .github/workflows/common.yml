name: common

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string

jobs:
  lock_file:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: cd ${{ inputs.project_dir }} && uv lock --locked

  linting:
    runs-on: ubuntu-latest
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: uvx ruff check .

  formatting:
    runs-on: ubuntu-latest
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: uvx ruff format --check .

  tests:
    runs-on: ubuntu-latest
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: |
          uv run pytest -v --durations=0 --cov --cov-report=xml
