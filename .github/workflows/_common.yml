name: common

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string

jobs:
  lock_file:
    runs-on: [self-hosted, "hetzner"]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
      - run: cd ${{ inputs.project_dir }} && uv lock --locked

  linting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 check .

  formatting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 format --check .

  tests:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select and run affected tests
        shell: bash
        run: |
          BASE="origin/develop"
          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            BASE="${{ github.event.before }}"
            [[ -n "$BASE" && "$BASE" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "$BASE^{commit}" 2>/dev/null \
              || BASE="HEAD^1"
          fi

          BASELINE=$(git merge-base HEAD "$BASE") || {
            echo "::error::cannot resolve merge-base between HEAD and $BASE"
            exit 1
          }
          echo "baseline: $BASELINE"

          CHANGED=$(uv run poly diff --since "$BASELINE" --bricks --deps --short)
          echo "changed bricks: $CHANGED"

          DIRS=()
          IFS=',' read -ra BRICKS <<< "$CHANGED"
          for brick in "${BRICKS[@]}"; do
            for root in components bases; do
              dir="test/$root/bot_detector/$brick"
              if [[ -d "$dir" ]]; then
                DIRS+=("$dir")
                break
              fi
            done
          done

          if ((${#DIRS[@]})); then
            uv run pytest "${DIRS[@]}" -v --durations=0
          else
            echo "No affected tests."
          fi
