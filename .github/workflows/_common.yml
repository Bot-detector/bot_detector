name: common

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string

jobs:
  lock_file:
    runs-on: [self-hosted, "hetzner"]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: cd ${{ inputs.project_dir }} && uv lock --locked

  linting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 check .

  formatting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 format --check .

  tests:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: |
          uv run pytest -v --durations=0 --cov --cov-report=xml
