name: common

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string

jobs:
  lock_file:
    runs-on: [self-hosted, "hetzner"]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
      - run: cd ${{ inputs.project_dir }} && uv lock --locked

  linting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 check .

  formatting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 format --check .

  tests:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    permissions:
      contents: read
    container:
      image: quay.io/bot_detector/cicd:py3.12-trixie-slim
    steps:
      - uses: actions/checkout@v6
        # full history is needed to compute the merge-base with develop
        with:
          fetch-depth: 0
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: select and run affected tests
        shell: bash
        run: |
          # baseline for a develop push: the push event's before SHA, which
          # covers multi-commit pushes. workflow_dispatch has no before, and
          # force pushes can orphan it, so fall back to the last commit.
          BEFORE="${{ github.event.before }}"
          if [[ "$GITHUB_REF_NAME" == "develop" ]] \
            && [[ -n "$BEFORE" ]] \
            && [[ "$BEFORE" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif [[ "$GITHUB_REF_NAME" == "develop" ]]; then
            BASE="HEAD^1"
          else
            BASE="origin/develop"
          fi
          BASELINE=$(git merge-base HEAD "$BASE")
          echo "baseline: $BASELINE"

          # changed bricks + every brick that imports them (--deps)
          CHANGED=$(uv run poly diff \
            --since "$BASELINE" \
            --bricks --deps --short)
          echo "changed bricks: $CHANGED"

          # brick name -> mirrored test dir
          DIRS=()
          IFS=',' read -ra BRICKS <<< "$CHANGED"
          for brick in "${BRICKS[@]}"; do
            [[ -n "$brick" ]] || continue
            for root in components bases; do
              dir="test/$root/bot_detector/$brick"
              if [[ -d "$dir" ]]; then
                DIRS+=("$dir")
                break
              fi
            done
          done

          if [[ ${#DIRS[@]} -eq 0 ]]; then
            echo "no affected test dirs; skipping pytest"
            exit 0
          fi
          uv run pytest "${DIRS[@]}" -v --durations=0
