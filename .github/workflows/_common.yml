name: common

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string

jobs:
  lock_file:
    runs-on: [self-hosted, "hetzner"]
    container:
      image: quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest
    steps:
      - uses: actions/checkout@v6
      - run: cd ${{ inputs.project_dir }} && uv lock --locked

  linting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 check .

  formatting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 format --check .

  tests:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest
    steps:
      - uses: actions/checkout@v6
        # full history is needed to compute the merge-base with develop
        with:
          fetch-depth: 0
      - name: select affected tests
        id: sel
        shell: bash
        run: |
          # baseline = branch point vs develop (PRs test exactly their own
          # changes), or the previous commit when develop itself is pushed
          if [[ "$GITHUB_REF_NAME" == "develop" ]]; then
            BASE="HEAD^1"
          else
            BASE="origin/develop"
          fi
          BASELINE=$(git merge-base HEAD "$BASE")

          # changed bricks + every brick that imports them (--deps)
          CHANGED=$(uv run poly diff \
            --since "$BASELINE" \
            --bricks --deps --short)
          echo "changed bricks: $CHANGED"

          # brick name -> mirrored test dir
          DIRS=()
          IFS=',' read -ra BRICKS <<< "$CHANGED"
          for brick in "${BRICKS[@]}"; do
            [[ -n "$brick" ]] || continue
            for root in components bases; do
              dir="test/$root/bot_detector/$brick"
              if [[ -d "$dir" ]]; then
                DIRS+=("$dir")
                break
              fi
            done
          done
          printf 'args=%s\n' "${DIRS[*]}" >> "$GITHUB_OUTPUT"
      - name: tests
        if: steps.sel.outputs.args != ''
        run: uv run pytest ${{ steps.sel.outputs.args }} -v --durations=0
