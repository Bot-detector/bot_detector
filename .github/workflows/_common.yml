name: common

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string

jobs:
  lock_file:
    runs-on: [self-hosted, "hetzner"]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: cd ${{ inputs.project_dir }} && uv lock --locked

  linting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 check .

  formatting:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - run: uvx ruff@0.15.22 format --check .

  tests:
    runs-on: [self-hosted, "hetzner"]
    needs: [lock_file]
    container:
      image: ghcr.io/astral-sh/uv:bookworm-slim
    steps:
      - uses: actions/checkout@v6
      # explicit unit paths (bases + components): the DST sim suite is
      # excluded here and runs nightly via sim.yml. serial on purpose:
      # the unit suite is import-bound, workers cost more than they
      # save (18.6s under xdist vs 7.9s serial on 24 cores)
      - run: uv run pytest test/bases/bot_detector test/components/bot_detector -v --durations=0
