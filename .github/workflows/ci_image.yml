name: ci_image

on:
  workflow_dispatch:

# avoid two overlapping pushes to the same tag
concurrency:
  group: ci_image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_image:
    runs-on: [self-hosted, "hetzner"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: bot_detector+quay_robot
          password: ${{ secrets.QUAY_REGISTERY_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            --file _infra/_uv_python312_trixie_slim_git/Dockerfile \
            --tag quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest \
            _infra/_uv_python312_trixie_slim_git

      # fail before pushing if git, uv, python or TLS (CA certificates) is broken
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint /bin/sh \
            quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest \
            -c 'git --version && uv --version && python --version \
              && git ls-remote https://github.com/Bot-detector/bot_detector HEAD'

      - name: Push image
        run: docker push quay.io/bot_detector/uv-python3.12-trixie-slim-git:latest
