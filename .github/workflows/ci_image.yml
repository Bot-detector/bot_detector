name: ci_image

on:
  workflow_dispatch:

# avoid two overlapping pushes to the same tag
concurrency:
  group: ci_image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: quay.io/bot_detector/cicd:py3.12-trixie-slim
  DOCKERFILE: _infra/_cicd/py3.12-trixie-slim/Dockerfile
  CONTEXT: _infra/_cicd/py3.12-trixie-slim
  BASE_IMAGE: ghcr.io/astral-sh/uv:python3.12-trixie-slim
  BASE_DIGEST: sha256:d4a752dd52f42e0c508bb0b6a912f15922bb32e42f66af30671c3fdc0d759f21

jobs:
  build_image:
    runs-on: [self-hosted, "hetzner"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set variables
        id: vars
        run: |
          echo "GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

      - name: Install Docker Buildx
        run: |
          export BUILDX_URL=https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64
          mkdir -p $HOME/.docker/cli-plugins
          curl -SL $BUILDX_URL -o $HOME/.docker/cli-plugins/docker-buildx
          chmod a+x $HOME/.docker/cli-plugins/docker-buildx
          docker buildx version

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: bot_detector+quay_robot
          password: ${{ secrets.QUAY_REGISTERY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker buildx build "$CONTEXT" \
            --file "$DOCKERFILE" \
            --platform linux/amd64 \
            --tag "$IMAGE" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.version=${{ steps.vars.outputs.GIT_HASH }}" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "org.opencontainers.image.base.name=$BASE_IMAGE" \
            --annotation "org.opencontainers.image.base.digest=$BASE_DIGEST" \
            --annotation "org.opencontainers.image.description=CI job container: uv + python 3.12 + git (debian trixie slim)" \
            --push
