[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "bot-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp==3.14.3",
    "aiokafka==0.12.0",
    "asyncmy==0.2.12",
    "boto3==1.40.34",
    "cryptography==50.0.0",
    "discord-py>=2.2.2",
    "fastapi==0.115.12",
    "jinja2==3.1.6",
    "matplotlib>=3.10.0",
    "mlflow-skinny==3.4.0",
    "numpy==2.3.3",
    "orjson>=3.11.8",
    "osrs==0.0.15",
    "pandas==2.3.2",
    "prometheus-client==0.22.0",
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "scikit-learn==1.7.2",
    "seaborn>=0.13.0",
    "sqlalchemy==2.0.44",
    "uvicorn==0.34.2",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "kafka-python>=2.0.2",
    "polylith-cli>=1.24.0",
    "pytest>=8.3.4",
    "ruff==0.15.22",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.1",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "tomli-w>=1.2.0",
]

[tool.hatch.build]
dev-mode-dirs = [
    "components",
    "bases",
    "development",
    "development/dst/src",
    ".",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
# bricks are plain source dirs on sys.path (see _bot_detector.pth); without
# mypy_path mypy resolves bot_detector.* from site-packages and skips them
# (import-untyped, no py.typed markers)
namespace_packages = true
explicit_package_bases = true
mypy_path = ["components", "bases", "development/dst/src"]
# other bricks have pre-existing errors; extend as they get cleaned up
files = ["bases/bot_detector/firehose"]
