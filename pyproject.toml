[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "bot-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp==3.14.1",
    "aiokafka==0.12.0",
    "asyncmy==0.2.11",
    "boto3==1.40.34",
    "cryptography==48.0.1",
    "discord-py>=2.2.2",
    "fastapi==0.115.12",
    "jinja2==3.1.6",
    "matplotlib>=3.10.0",
    "mlflow-skinny==3.4.0",
    "numpy==2.3.3",
    "orjson>=3.11.8",
    "osrs==0.0.15",
    "pandas==2.3.2",
    "prometheus-client==0.22.0",
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.31",
    "scikit-learn==1.7.2",
    "seaborn>=0.13.0",
    "sqlalchemy==2.0.44",
    "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
    "kafka-python>=2.0.2",
    "polylith-cli>=1.24.0",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.1",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "tomli-w>=1.2.0",
    "aioresponses>=0.7.8",
]

[tool.hatch.build]
dev-mode-dirs = [
    "components",
    "bases",
    "development",
    ".",
]

[tool.hatch.metadata]
allow-direct-references = true
