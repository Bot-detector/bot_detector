services:
  opencode:
    build:
      context: .
      dockerfile: _opencode/Dockerfile
      target: build
    image: my_opencode
    volumes:
      # opencode source code
      - ./_opencode/.opencode:/opencode/.opencode
      - ./_opencode/Dockerfile:/opencode/_opencode/Dockerfile
      - ./AGENTS.md:/opencode/AGENTS.md
      # project source code
      - ./bases:/opencode/bases
      - ./components:/opencode/components
      - ./projects:/opencode/projects
      - ./test:/opencode/test
      - ./uv.lock:/opencode/uv.lock
      - ./pyproject.toml:/opencode/pyproject.toml
      - ./workspace.toml:/opencode/workspace.toml:ro
      # infrastructure
      - ./_kafka:/opencode/_kafka
      - ./_mysql:/opencode/_mysql
      # configs and docs
      - ./specs:/opencode/specs
      - ./docker-compose.yml:/opencode/docker-compose.yml
      - ./README.md:/opencode/README.md
    env_file:
      - ./_opencode/.env
    # Equivalent to -it
    stdin_open: true
    tty: true