# this docker-compose file is used for debugging and development purposes
services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - 9092:9092
    healthcheck:
      test:
        [
          "CMD",
          "./opt/kafka/bin/kafka-topics.sh",
          "--list",
          "--bootstrap-server",
          "localhost:9092"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - botdetector-network

  kafka_setup:
    container_name: kafka_setup
    image: bd/kafka_setup # tags the image if build
    build:
      context: ./_infra
      dockerfile: _kafka/Dockerfile
    environment:
      - KAFKA_BROKER=kafka:9092
      - SEED_PLAYERS=100
      - SEED_SCRAPES_PER_PLAYER=10
      - SEED_REPORTS=0
      - RESET_TOPICS=true
      - RANDOM_SEED=42
    networks:
      - botdetector-network
    depends_on:
      kafka:
        condition: service_healthy

  kafdrop:
    container_name: kafdrop
    image: obsidiandynamics/kafdrop:latest
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms32M -Xmx64M
      - SERVER_SERVLET_CONTEXTPATH=/
    ports:
      - 9000:9000
    restart: on-failure
    networks:
      - botdetector-network
    depends_on:
      kafka:
        condition: service_healthy

  mysql:
    container_name: mysql
    image: bd/mysql # tags the image if build
    build:
      context: ./_infra/_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_bot_buster
      # - MYSQL_DATABASE=playerdata
    ports:
      - 3307:3306
    networks:
      - botdetector-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_bot_buster"]
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 5s
  mysql_setup:
    container_name: mysql_setup
    image: bd/mysql_setup # tags the image if build
    build:
      context: ./_infra
      dockerfile: _mysql_data/Dockerfile
    environment:
      - DATABASE_URL=mysql+asyncmy://root:root_bot_buster@mysql:3306/playerdata
      - DEBUG=False
      - SEED_PLAYERS=100
      - SEED_REPORTS=100
      - SEED_PREDICTIONS=100
      - SKIP_IF_EXISTING=true
      - SKIP_THRESHOLD=100
      - RANDOM_SEED=42
    networks:
      - botdetector-network
    depends_on:
      mysql:
        condition: service_healthy
  minio:
    image: minio/minio
    expose:
      - "9000"
      - "9001"
    ports:
      - 9001
    environment:
      MINIO_ROOT_USER: "minio_user"
      MINIO_ROOT_PASSWORD: "minio_password"
    volumes:
      - ./_infra/_minio_data:/data
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    command: server /data --console-address ":9001"
    networks:
      - botdetector-network
  project_debugger:
    container_name: project_debugger
    image: bd/project_debugger # tags the image if build 
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
    # command: ["uv", "run", "bases/bot_detector/hiscore_scraper/core.py"]
    # command: uv run uvicorn bases.bot_detector.api_public.src.core.server:app --host 0.0.0.0 --reload --port 5000
    # command: uv run uvicorn bases.bot_detector.website.core.server:app --host 0.0.0.0 --reload --port 5000
    # command: uv run uvicorn bases.bot_detector.api_ml.core.server:app --host 0.0.0.0 --reload --port 5000
    command: ["sleep", "infinity"]
    ports:
      - 5000 # api endpoint
      - 8000 # metrics endpoint
    volumes:
      - ./bases:/app/bases
      - ./components:/app/components
      - ./projects:/app/projects
    
    # network_mode: host # needed if we do any portforwarding from the cluster
    networks:
      - botdetector-network
    environment:
      - UV_HTTP_TIMEOUT=120
      - BASE_URL=http://api_ml:5000
      - MODEL_NAME=multi_model_v1
    env_file:
      - .env
networks:
  botdetector-network:
    name: bd-network