[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "job_hs_migration_v3"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "aiokafka==0.12.0",
    "asyncmy==0.2.11",
    "cryptography==46.0.6",
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "sqlalchemy==2.0.44",
    "orjson==3.11.6",
]

[project.scripts]
job_hs_migration_v3 = "bot_detector.job_hs_migration_v3.core:run"

# This section is needed for building
[tool.hatch.build.targets.wheel]
packages = ["bot_detector"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bot_detector/job_hs_migration_v3" = "bot_detector/job_hs_migration_v3"
"../../components/bot_detector/database" = "bot_detector/database"
"../../components/bot_detector/event_queue" = "bot_detector/event_queue"
"../../components/bot_detector/structs" = "bot_detector/structs"
"../../components/bot_detector/logfmt" = "bot_detector/logfmt"