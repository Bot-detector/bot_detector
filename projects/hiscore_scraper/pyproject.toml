[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "hiscore_scraper"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "orjson==3.11.5",
    "prometheus-client==0.22.0",
    "aiohttp==3.11.11",
    "aiokafka==0.12.0",
]

[project.scripts]
hiscore_scraper = "bot_detector.hiscore_scraper.core:run"

# This section is needed for building
[tool.hatch.build.targets.wheel]
packages = ["bot_detector"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bot_detector/hiscore_scraper" = "bot_detector/hiscore_scraper"
"../../components/bot_detector/proxy_manager" = "bot_detector/proxy_manager"
"../../components/bot_detector/event_queue" = "bot_detector/event_queue"
"../../components/bot_detector/structs" = "bot_detector/structs"
"../../components/bot_detector/logfmt" = "bot_detector/logfmt"
"../../components/bot_detector/osrs_hs_api" = "bot_detector/osrs_hs_api"
"../../components/bot_detector/rate_limiter" = "bot_detector/rate_limiter"
"../../components/bot_detector/retry_tracker" = "bot_detector/retry_tracker"
