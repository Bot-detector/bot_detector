[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "hiscore_scraper"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "aiokafkaengine==0.1.0",
    "osrs==0.0.15",
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "orjson==3.10.16",
    "prometheus-client==0.22.0",
]

[project.scripts]
hiscore_scraper = "bot_detector.hiscore_scraper.core:run"

# This section is needed for building
[tool.hatch.build.targets.wheel]
packages = ["bot_detector"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bot_detector/hiscore_scraper" = "bot_detector/hiscore_scraper"
"../../components/bot_detector/proxy_manager" = "bot_detector/proxy_manager"
"../../components/bot_detector/kafka" = "bot_detector/kafka"
"../../components/bot_detector/core" = "bot_detector/core"
"../../components/bot_detector/player" = "bot_detector/player"
"../../components/bot_detector/highscore_worker" = "bot_detector/highscore_worker"
