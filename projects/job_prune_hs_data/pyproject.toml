[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "job_prune_hs_data"
version = "0.1.0"

requires-python = ">=3.10"

dependencies = [
    "asyncmy==0.2.10",
    "cryptography==44.0.1",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.44",
]

[project.scripts]
job_prune_hs_data = "bot_detector.job_prune_hs_data.core:run"

# This section is needed for building
[tool.hatch.build.targets.wheel]
packages = ["bot_detector"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bot_detector/job_prune_hs_data" = "bot_detector/job_prune_hs_data"
"../../components/bot_detector/core" = "bot_detector/core"
