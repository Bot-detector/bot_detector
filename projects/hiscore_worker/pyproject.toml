[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "hiscore_worker"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "aiokafkaengine>=0.1.0",
    "asyncmy>=0.2.10",
    "cryptography>=44.0.0",
    "pydantic-settings>=2.7.0",
    "pydantic>=2.10.4",
    "sqlalchemy>=2.0.37",
]

[project.scripts]
hiscore_worker = "bot_detector.hiscore_worker.core:run"

# This section is needed for building
[tool.hatch.build.targets.wheel]
packages = ["bot_detector"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bot_detector/hiscore_worker" = "bot_detector/hiscore_worker"
"../../components/bot_detector/database" = "bot_detector/database"
"../../components/bot_detector/kafka_client" = "bot_detector/kafka_client"
"../../components/bot_detector/schema" = "bot_detector/schema"
"../../components/bot_detector/logfmt" = "bot_detector/logfmt"