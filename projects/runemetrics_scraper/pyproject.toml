[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "runemetrics_scraper"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "osrs==0.0.15",
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "orjson==3.11.5",
    "prometheus-client==0.22.0",
    "aiohttp==3.11.11",
    "aiokafka==0.12.0",
]

[project.scripts]
runemetrics_scraper = "bot_detector.runemetrics_scraper.core:run"

# This section is needed for building
[tool.hatch.build.targets.wheel]
packages = ["bot_detector"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/bot_detector/runemetrics_scraper" = "bot_detector/runemetrics_scraper"
"../../components/bot_detector/runemetrics_api" = "bot_detector/runemetrics_api"
"../../components/bot_detector/proxy_manager" = "bot_detector/proxy_manager"
"../../components/bot_detector/event_queue" = "bot_detector/event_queue"
"../../components/bot_detector/structs" = "bot_detector/structs"
"../../components/bot_detector/logfmt" = "bot_detector/logfmt"
"../../components/bot_detector/retry_tracker" = "bot_detector/retry_tracker"
