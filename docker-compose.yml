services:
  # KAFKA
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - 9092:9092
    healthcheck:
      test:
        [
          "CMD",
          "./opt/kafka/bin/kafka-topics.sh",
          "--list",
          "--bootstrap-server",
          "localhost:9092"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - botdetector-network
  kafka_setup:
    container_name: kafka_setup
    image: bd/kafka_setup # tags the image if build
    build:
      context: ./_kafka
    # command: ["sleep", "infinity"]
    environment:
      - KAFKA_BROKER=kafka:9092
    networks:
      - botdetector-network
    depends_on:
      kafka:
        condition: service_healthy
  kafdrop:
    container_name: kafdrop
    image: obsidiandynamics/kafdrop:latest
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms32M -Xmx64M
      - SERVER_SERVLET_CONTEXTPATH=/
    ports:
      - 9042:9000 # too many things use 9000 like portainer.. lets use 9042 instead?
    restart: on-failure
    networks:
      - botdetector-network
    depends_on:
      kafka:
        condition: service_healthy
  # MYSQL
  mysql:
    container_name: mysql
    image: bd/mysql # tags the image if build
    build:
      context: ./_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_bot_buster
      # - MYSQL_DATABASE=playerdata
    ports:
      - 3307:3306
    networks:
      - botdetector-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_bot_buster"]
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 5s
  mysql_setup:
    container_name: mysql_setup
    image: bd/mysql_setup # tags the image if build
    build:
      context: ./_mysql_data
    # command: ["sleep", "infinity"]
    environment:
      - DATABASE_URL=mysql+asyncmy://root:root_bot_buster@mysql:3306/playerdata
      - DEBUG=False
    networks:
      - botdetector-network
    depends_on:
      mysql:
        condition: service_healthy
  # MINIO
  minio:
    image: minio/minio
    expose:
      - "9000"
      - "9001"
    ports:
      - 9001
    environment:
      MINIO_ROOT_USER: "minio_user"
      MINIO_ROOT_PASSWORD: "minio_password"
    volumes:
      - ./_minio_data:/data
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    command: server /data --console-address ":9001"
    networks:
      - botdetector-network
  # Create a bucket named "bucket" if it doesn't exist
  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      bash -c "
      mc alias set minio http://minio:9000 minio_user minio_password &&
      if ! mc ls minio/bucket; then
        mc mb minio/models
      else
        echo 'bucket already exists'
      fi
      "
  # COMPONENTS
  hiscore_scraper:
    container_name: hiscore_scraper
    image: bd/hiscore_scraper # tags the image if build
    build:
      context: ./
      dockerfile: ./projects/hiscore_scraper/Dockerfile
      target: production
    # command: ["uv", "run", "uvicorn", "bot_detector.api_public.src.core.server:app", "--host", "0.0.0.0", "--port", "5000", "--log-level", "warning", "--reload", "--reload-dir", "/app/bot_detector/api_public/"]
    networks:
      - botdetector-network
    env_file:
      - .env
    depends_on:
      kafka_setup:
        condition: service_completed_successfully
  runemetrics_scraper:
    container_name: runemetrics_scraper
    image: bd/runemetrics_scraper # tags the image if build
    build:
      context: ./
      dockerfile: ./projects/runemetrics_scraper/Dockerfile
      target: production
    # command: ["sleep", "infinity"]
    # command: ["uv",  "run", "bot_detector/runemetrics_scraper/src/core.py"]
    networks:
      - botdetector-network
    env_file:
      - .env
    depends_on:
      kafka_setup:
        condition: service_completed_successfully
  worker_hiscore:
    container_name: worker_hiscore
    image: bd/worker_hiscore # tags the image if build
    build:
      context: ./
      dockerfile: ./projects/worker_hiscore/Dockerfile
      target: production
    # command: ["sleep", "infinity"]
    # command: ["uv", "run", "bot_detector/worker_hiscore/src/core.py"]
    networks:
      - botdetector-network
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      kafka_setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      mysql_setup:
        condition: service_completed_successfully
  worker_report:
    container_name: worker_report
    image: bd/worker_report # tags the image if build
    build:
      context: ./
      dockerfile: ./projects/worker_report/Dockerfile
      target: production
    # command: ["sleep", "infinity"]
    networks:
      - botdetector-network
    env_file:
      - .env
    depends_on:
      kafka_setup:
        condition: service_completed_successfully
      mysql_setup:
        condition: service_completed_successfully
  scrape_task_producer:
    container_name: scrape_task_producer
    image: bd/scrape_task_producer # tags the image if build
    build:
      context: ./
      dockerfile: ./projects/scrape_task_producer/Dockerfile
      target: production
    # command: ["sleep", "infinity"]
    networks:
      - botdetector-network
    env_file:
      - .env
    depends_on:
      kafka_setup:
        condition: service_completed_successfully
      mysql_setup:
        condition: service_completed_successfully
  job_prune_hs_data:
    container_name: job_prune_hs_data
    image: bd/job_prune_hs_data # tags the image if build
    build:
      context: ./
      dockerfile: ./projects/job_prune_hs_data/Dockerfile
      target: production
    # command: ["sleep", "infinity"]
    networks:
      - botdetector-network
    environment:
      - LIMIT=100
      - DATABASE_URL=mysql+asyncmy://job-prune-hs:job_prune_hs_pw@mysql:3306/playerdata
    env_file:
      - .env
    depends_on:
      mysql_setup:
        condition: service_completed_successfully
  api_public:
    container_name: api_public
    image: bd/api_public
    build:
      context: .
      dockerfile: ./projects/api_public/Dockerfile
      target: builder
    # command: ["sleep", "infinity"]
    command: >
      sh -c "cd ../.. && projects/api_public/.venv/bin/uvicorn bases.bot_detector.api_public.src.core.server:app --host 0.0.0.0 --port 5000 --log-level warning --reload --reload-dir /app"
    env_file:
      - .env
    environment:
      - KAFKA_HOST=kafka:9092
      - DATABASE_URL=mysql+asyncmy://root:root_bot_buster@mysql:3306/playerdata
      - ENV=DEV
      - POOL_RECYCLE=60
      - POOL_TIMEOUT=30
    volumes:
      - ./bases:/bases
      - ./components:/components
    ports:
      - 5000
    networks:
      - botdetector-network
    depends_on:
      kafka_setup:
        condition: service_completed_successfully
      mysql_setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:5000/\").getcode()==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  wait_for_api_public:
    image: alpine:latest
    container_name: wait_for_api_public
    command: ["sh", "-c", "echo 'api_public healthy'"]
    depends_on:
      api_public:
        condition: service_healthy
    networks:
      - botdetector-network
  website:
    container_name: website
    image: bd/website
    build:
      context: .
      dockerfile: ./projects/website/Dockerfile
    env_file:
      - .env
    environment:
      BD_TOKEN: ""
      ENV: "DEV"
      RELEASE_VERSION: "0.1"
      PATREON_CLIENT_ID: ""
      PATREON_CLIENT_SECRET: ""
    ports:
      - 5000
    networks:
      - botdetector-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:5000/monitoring\").getcode()==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  api_ml:
    container_name: api_ml
    image: bd/api_ml
    build:
      context: .
      dockerfile: ./projects/api_ml/Dockerfile
      target: builder
    # command: ["sleep", "infinity"]
    command: >
      sh -c "cd ../.. && projects/api_ml/.venv/bin/uvicorn bases.bot_detector.api_ml.core.server:app --host 0.0.0.0 --port 5000 --log-level warning --reload"
    env_file:
      - .env
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio_user
      - AWS_SECRET_ACCESS_KEY=minio_password
      - UV_HTTP_TIMEOUT=120
    volumes:
      - ./bases:/app/bases
      - ./components:/app/components
    ports:
      - 5001:5000
    networks:
      - botdetector-network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:5000/\").getcode()==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  botdetector-network:
    name: bd-network